function chartLine(data){const w=720,h=230,left=42,right=16,top=18,bottom=34,max=100,step=(w-left-right)/(data.length-1),y=v=>top+(max-v)/max*(h-top-bottom),points=(key)=>data.map((x,i)=>[left+i*step,y(x[key])]);const smooth=pts=>pts.map((p,i)=>{if(i===0)return`M ${p[0]} ${p[1]}`;const prev=pts[i-1],mid=(prev[0]+p[0])/2;return` C ${mid} ${prev[1]}, ${mid} ${p[1]}, ${p[0]} ${p[1]}`}).join('');const a=points(1),b=points(2),areaA=`${smooth(a)} L ${a[a.length-1][0]} ${h-bottom} L ${a[0][0]} ${h-bottom} Z`,areaB=`${smooth(b)} L ${b[b.length-1][0]} ${h-bottom} L ${b[0][0]} ${h-bottom} Z`;return `<div class="line-chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="批改与陪练折线图"><defs><linearGradient id="lineFillBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38baff" stop-opacity=".28"/><stop offset="1" stop-color="#38baff" stop-opacity="0"/></linearGradient><linearGradient id="lineFillGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26d6b0" stop-opacity=".2"/><stop offset="1" stop-color="#26d6b0" stop-opacity="0"/></linearGradient></defs>${[0,25,50,75,100].map(v=>`<line x1="${left}" x2="${w-right}" y1="${y(v)}" y2="${y(v)}" class="line-grid"/><text x="${left-10}" y="${y(v)+4}" text-anchor="end" class="line-axis">${v}%</text>`).join('')}<path d="${areaA}" class="line-area area-blue" fill="url(#lineFillBlue)"/><path d="${areaB}" class="line-area area-green" fill="url(#lineFillGreen)"/><path pathLength="1" d="${smooth(a)}" class="data-line line-blue"/><path pathLength="1" d="${smooth(b)}" class="data-line line-green"/>${a.map((p,i)=>`<g class="line-point" data-grade="${data[i][0]}" data-pigai="${data[i][1]}" data-fudao="${data[i][2]}"><circle cx="${p[0]}" cy="${p[1]}" r="4" class="point-blue"/><title>${data[i][0]} · 批改 ${data[i][1]}%</title></g>`).join('')}${b.map((p,i)=>`<g class="line-point" data-grade="${data[i][0]}" data-pigai="${data[i][1]}" data-fudao="${data[i][2]}"><circle cx="${p[0]}" cy="${p[1]}" r="4" class="point-green"/><title>${data[i][0]} · 陪练 ${data[i][2]}%</title></g>`).join('')}${data.map((x,i)=>`<text x="${left+i*step}" y="${h-10}" text-anchor="middle" class="line-label">${x[0]}</text>`).join('')}</svg><div class="line-tooltip" aria-hidden="true"></div></div><div class="mini-legend line-legend"><span><i></i>批改完成率</span><span><i class="green"></i>陪练完成率</span><em>悬停节点查看年级数据</em></div>`}

lass="more-btn" data-action="rank">完整排行</button></div><table class="data-table"><thead><tr><th>学校</th><th>核心数据</th><th>完成率</th><th>状态</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${r[3]==='优秀'?'green':'orange'}">${r[3]}</span></td></tr>`).join('')}</tbody></table></div><div class="card"><div class="card-head"><div><div class="card-title">业务动态</div><div class="card-sub">实时更新的区域运营事件</div></div><button class="more-btn" data-action="more">更多动态</button></div><div class="activity"><div class="activity-item"><strong>${tab==='essay'?'高分作文沉淀':'区域数据达标'}</strong><p>${tab==='essay'?'本周新增 1,286 条高分片段，覆盖 9 个年级。':'全区核心指标保持稳定增长，重点学校完成率持续提升。'}</p><div class="progress"><span style="width:${tab==='essay'?82:91}%"></span></div></div><div class="activity-item"><strong>${tab==='ink'?'设备运维提醒':'今日运营提醒'}</strong><p>${tab==='ink'?'有 36 台设备连续 24 小时未上线，请关注设备状态。':'今日 16:00 将生成区域日报，可在明细中查看。'}</p><div class="progress"><span style="width:${tab==='ink'?36:68}%"></span></div></div></div></div></div>`;el.classList.toggle('active',tab==='essay');bindActions(el)}
function bindActions(root){root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>showToast({detail:'已打开明细面板',export:'已生成演示数据导出任务',view:'趋势分析已切换',rank:'已展开完整排行',more:'暂无更多动态'}[b.dataset.action]));root.querySelectorAll('tbody tr').forEach(r=>r.onclick=()=>showToast('已查看：'+r.children[0].textContent+' 的业务详情'))}
function showToast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),1800)}
Object.keys(datasets).forEach(render);document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));showToast('已切换至 '+b.textContent.trim()+' 数据看板')});document.getElementById('refreshBtn').onclick=()=>showToast('数据已刷新 · 更新时间 18:21');document.getElementById('periodBtn').onclick=()=>showToast('时间范围：2025—2026 · 第二学期');document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');showToast(document.body.classList.contains('dark')?'已切换深色主题':'已切换浅色主题')};

function geoMap(d){return `<div class="card geo-map" data-zoom="1"><div class="geo-grid"></div><div class="geo-land"></div><div class="geo-heat"></div><div class="map-title"><strong>${d.map}</strong><span>滚轮或按钮缩放 · 点位持续扩散</span></div><div class="map-stat"><b>${d.kpis[0][1]}</b><small>${d.stat}</small></div>${['朝阳实验','八十中学','陈经纶','日坛中学','和平街一中','朝阳外国语','三里屯一中'].map((n,i)=>`<span class="geo-point" style="left:${[49,59,42,67,55,72,37][i]}%;top:${[52,42,63,58,70,48,47][i]}%" data-name="${n}"></span>`).join('')}<div class="map-legend"><i></i>使用学校点位 · 扩散范围代表活跃度</div><div class="geo-controls"><button data-geo="plus">+</button><button data-geo="minus">−</button><button data-geo="reset">⟳</button></div></div>`}
function geoBind(root){const map=root.querySelector('.geo-map'),grid=root.querySelector('.geo-grid');if(!map)return;let z=1;const apply=()=>{grid.style.transform=`scale(${z})`;map.dataset.zoom=z};root.querySelectorAll('[data-geo]').forEach(b=>b.onclick=()=>{z=b.dataset.geo==='plus'?Math.min(1.8,z+.15):b.dataset.geo==='minus'?Math.max(.8,z-.15):1;apply()});map.addEventListener('wheel',e=>{e.preventDefault();z=Math.max(.8,Math.min(1.8,z+(e.deltaY<0?.08:-.08)));apply()},{passive:false})}
function specialRender(tab){const d=datasets[tab],el=document.getElementById(tab);if(tab==='essay'){const old=el.innerHTML;el.innerHTML=old.replace(/<div class="card map-card">[\s\S]*?<\/div><div class="card snapshot">/,orbitMap(d)+'<div class="card snapshot">');orbitBind(el);return}

ss="card"><div class="card-title">作业趋势</div></div>'}</div>`;bindActions(el);return}

['essay','homework','ink'].forEach(specialRender);document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));showToast('已切换至 '+b.textContent.trim()+' 数据看板')});

<script>
(function(){
  const essay=document.getElementById('essay');if(!essay||essay.querySelector('.quote-panel'))return;
  const quotes=[
    ['岁月在她的眼角刻下了痕迹，却未曾带走她眼底泛起的温柔。','周明轩 · 《那盏没有熄灭的灯》'],
    ['落叶在风中跳着最后一支舞，把秋天轻轻放进了我的掌心。','陈若曦 · 《雨后的银杏路》'],
    ['少年的肩头承载着清风明月，笔尖落下的每一个字都在叩响未来。','林知夏 · 《风穿过操场的下午》'],
    ['清晨的操场还带着凉意，鞋底一次次踏过跑道，也把放弃的念头一点点踏碎。','沈星禾 · 《把坚持写进清晨》']
  ];let idx=0;
  const panel=document.createElement('div');panel.className='card quote-panel';panel.innerHTML='<div class="card-head"><div><div class="card-title">作文好句</div><div class="card-sub">AI 批改沉淀的高分表达 · 悬停或点击切换</div></div><div class="quote-count"><b>9,760</b><span>句好句沉淀</span></div></div><div class="quote-body"><div><div class="quote-text"></div><div class="quote-meta"></div><div class="quote-actions"><button class="quote-dot active" data-q="0"></button><button class="quote-dot" data-q="1"></button><button class="quote-dot" data-q="2"></button><button class="quote-dot" data-q="3"></button><button class="quote-next">换一句 →</button></div></div></div>';
  essay.appendChild(panel);const text=panel.querySelector('.quote-text'),meta=panel.querySelector('.quote-meta');
  function show(i){idx=(i+quotes.length)%quotes.length;text.textContent=quotes[idx][0];meta.textContent=quotes[idx][1];panel.querySelectorAll('.quote-dot').forEach((b,n)=>b.classList.toggle('active',n===idx))}show(0);
  panel.querySelector('.quote-next').onclick=()=>show(idx+1);panel.querySelectorAll('.quote-dot').forEach(b=>b.onclick=()=>show(+b.dataset.q));
}());
</script>
<script>
(function(){let activePoint=null;function show(point){const chart=point.closest('.line-chart'),tip=chart&&chart.querySelector('.line-tooltip');if(!chart||!tip)return;const grade=point.dataset.grade,pigai=point.dataset.pigai,fudao=point.dataset.fudao,delta=Math.abs(Number(pigai)-Number(fudao));tip.innerHTML='<b>'+grade+' · 数据详情</b><span>批改完成率 <i>'+pigai+'%</i></span><span>陪练完成率 <i>'+fudao+'%</i></span><em>两项差值 '+delta+' 个百分点</em>';tip.classList.add('show');const cr=chart.getBoundingClientRect(),pr=point.getBoundingClientRect(),tw=tip.offsetWidth||166,th=tip.offsetHeight||92;let left=pr.left-cr.left+14,top=pr.top-cr.top-th-12;if(left+tw>cr.width-8)left=pr.left-cr.left-tw-14;if(left<8)left=8;if(top<8)top=pr.bottom-cr.top+12;if(top+th>cr.height-8)top=cr.height-th-8;tip.style.left=left+'px';tip.style.top=top+'px';activePoint=point}document.addEventListener('pointerover',e=>{const point=e.target.closest&&e.target.closest('.line-point');if(point&&point!==activePoint)show(point)});document.addEventListener('pointerout',e=>{const point=e.target.closest&&e.target.closest('.line-point');if(point&&(!e.relatedTarget||!point.contains(e.relatedTarget))){const tip=point.closest('.line-chart')?.querySelector('.line-tooltip');if(tip)tip.classList.remove('show');activePoint=null}})}());
</script>
<script>
(function(){
  function playGrowth(view){
    if(!view)return;
    view.querySelectorAll('.num,.task-value,.map-stat b,.ring-content b').forEach(el=>{
      const original=el.dataset.growthText||el.textContent.trim();
      el.dataset.growthText=original;
      const match=original.match(/([\d,]+(?:\.\d+)?)/);
      if(!match)return;
      const target=Number(match[1].replace(/,/g,''));
      if(!Number.isFinite(target))return;
      const before=original.slice(0,match.index),after=original.slice((match.index||0)+match[0].length);
      const decimals=(match[1].split('.')[1]||'').length;
      const start=performance.now(),duration=920;
      function tick(now){
        const p=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-p,3),value=target*ease;
        const formatted=value.toLocaleString('zh-CN',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
        el.textContent=before+formatted+after;
        if(p<1)requestAnimationFrame(tick);else el.textContent=original;
      }
      requestAnimationFrame(tick);
    });
  }
  window.playGrowth=playGrowth;
  document.querySelectorAll('.view.active').forEach(playGrowth);
  document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>{
    setTimeout(()=>playGrowth(document.getElementById(btn.dataset.tab)),30);
  }));
}());
</script></body></html>
